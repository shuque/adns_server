[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adns_server"
dynamic = ["version"]
license = "MIT"

authors = [
    { name = "Shumon Huque", email = "shuque@gmail.com" },
]
description = "Authoritative DNS server written in Python"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    # cryptography >= 43.0.0: deterministic ECDSA (RFC 6979), which the offline
    # signer relies on for reproducible signatures.
    "cryptography>=43.0.0",
    # dnspython >= 2.7.0: current wire/DNSSEC surface used by server and signer;
    # 2.6.0+ is what added the 'deterministic' kwarg to dns.dnssec.sign.
    "dnspython>=2.7.0",
    "sortedcontainers",
    "pyyaml",
    "siphash",
    # cachetools >= 5.4.0: cachetools.cached() gained the info= keyword; the
    # online-signature cache passes info=True and fails on older versions.
    "cachetools>=5.4.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/shuque/check_zone_dnssec"
Issues = "https://github.com/shuque/check_zone_dnssec/issues"

[tool.setuptools]
py-modules = ["dnssec_util"]
script-files = ['adns_server.py', 'adnskeygen.py', 'signzone.py']

[tool.setuptools.dynamic]
version = {attr = "adns_server.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests/pytest"]
markers = [
    "signer: offline zone signer (signzone.py) tests -- no running server",
    "deleg: DELEG delegation-extension behavior tests",
]
